# Docker images: build every Dockerfile the way a fresh install does.
#
# The CI job that runs `next build` on a full checkout cannot see a source
# file reaching outside its Docker build context: every sibling directory
# exists on the runner, so the import resolves. The image is the only place it
# does not, and until this workflow nothing built the image before merge. Main
# shipped with an unbuildable frontend image three times for that reason
# (24dc0f97 on 2026-08-21, #457 on 2026-09-12, #501 on 2026-09-20), each found
# by someone running `docker compose up --build` on a fresh clone.
#
# Each image is built with the same context, Dockerfile, and per-Dockerfile
# ignore file docker-compose.yml and docs/deployment.md use, and nothing is
# pushed (publish-images.yml publishes; it never runs on pull requests). Layers are cached in the GitHub Actions cache so the `npm ci` and
# apt layers are paid once per lockfile change, not once per run.
name: Docker images

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Include stacked PRs whose base is another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - image: frontend-railway
            context: .
            dockerfile: frontend/Dockerfile.railway
            build_args: |
              SENTRY_UPLOAD_ENABLED=0
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: word-addin
            context: .
            dockerfile: word-addin/Dockerfile
            # The production webpack build refuses to run without the web app
            # URL (word-addin/webpack.config.js), and scripts/build-manifest.js
            # refuses the development placeholder add-in Id. Placeholder values,
            # as the word-addin workflow uses for its own build; nothing is
            # deployed.
            build_args: |
              REACT_APP_WEB_APP_URL=https://app.example.com
              WORD_ADDIN_PUBLIC_URL=https://word.example.com
              WORD_ADDIN_MANIFEST_ID=00000000-0000-4000-8000-000000000000
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.image == 'frontend-railway' || matrix.image == 'backend' }}
          tags: mike-ci:${{ matrix.image }}
          # GIT_SHA becomes the Sentry release (docs/observability.md); an
          # image without it reports events nobody can map to a commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify hosted frontend image boundary
        if: matrix.image == 'frontend-railway'
        run: |
          docker run --rm --entrypoint sh mike-ci:frontend-railway -ec \
            'test -f .next/BUILD_ID; test -f /packages/contracts/index.d.ts; test ! -f schema.sql'

      - name: Verify backend image boundary
        if: matrix.image == 'backend'
        run: |
          docker run --rm --entrypoint sh mike-ci:backend -ec \
            'test -f dist/index.js; test -f scripts/railway-predeploy.sh; test -f schema.sql; test -d migrations; test -f docker/db-init/adopt-ledger.sh; command -v psql; command -v soffice; command -v flock; test ! -d .next'
